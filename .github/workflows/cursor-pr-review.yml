# Manual PR review via Cursor CLI.
#
# Trigger: post a comment on a pull request that contains @agent
# (for example: "@agent レビューしてください").
#
# Prompt: .github/workflows/prompts/pr-review-agent.md (shared)
#         + .cursor/pr-review.md (per-repo; optional)
#
# Requires repository secret: CURSOR_API_KEY
# See https://cursor.com/docs/cli/github-actions
#
# Model: Composer 2.5 chooses Composer 2.5 or Grok 4.7 medium from the
# pull request. Avoid "auto" — it may route to other premium models.
# Review scripts are taken from the default branch, then the PR head is checked out.
#
# Trigger auth: only the repository owner (uttne) may invoke @agent. Public repos
# cannot restrict who may comment on issues/PRs to a single user at the GitHub level.

name: Cursor PR review (@agent)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@agent') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cursor-pr-review-${{ github.event.issue.number }}
      cancel-in-progress: true

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      TRIGGERED_BY: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Load workflow scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/workflows/prompts
          sparse-checkout-cone-mode: true

      - name: Preserve workflow scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr-tools/scripts" "$RUNNER_TEMP/pr-tools/prompts"
          cp .github/scripts/agentlib.py "$RUNNER_TEMP/pr-tools/scripts/"
          cp .github/scripts/pr_review.py "$RUNNER_TEMP/pr-tools/scripts/"
          cp .github/workflows/prompts/pr-review-agent.md "$RUNNER_TEMP/pr-tools/prompts/"
          {
            echo "AGENTLIB=$RUNNER_TEMP/pr-tools/scripts/agentlib.py"
            echo "PR_REVIEW=$RUNNER_TEMP/pr-tools/scripts/pr_review.py"
            echo "PROMPT_TEMPLATE_PATH=$RUNNER_TEMP/pr-tools/prompts/pr-review-agent.md"
          } >> "$GITHUB_ENV"

      - name: Acknowledge review request
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content='eyes' >/dev/null
          python3 "$AGENTLIB" progress pr received

      - name: Resolve pull request context
        id: pr
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          state=$(jq -er '.state' <<< "$pr_json")
          head_repository=$(jq -er '.head.repo.full_name' <<< "$pr_json")
          head_sha=$(jq -er '.head.sha' <<< "$pr_json")
          base_sha=$(jq -er '.base.sha' <<< "$pr_json")

          if [[ "$state" != "open" ]]; then
            echo "PR #$PR_NUMBER is not open."
            exit 1
          fi

          if [[ "$head_repository" != "$REPOSITORY" ]]; then
            echo "Reviews are limited to branches in $REPOSITORY (not fork PRs)."
            exit 1
          fi

          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          PR_HEAD_SHA="$head_sha" python3 "$AGENTLIB" progress pr pr_resolved

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Progress — checkout complete
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 "$AGENTLIB" progress pr checked_out

      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Progress — CLI ready
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 "$AGENTLIB" progress pr cli_ready

      - name: Select agent model
        timeout-minutes: 8
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ROUTER_TASK: review
        run: python3 "$AGENTLIB" select-model

      - name: Progress — model selected
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 "$AGENTLIB" progress pr cli_ready

      - name: Run review and post pull request review
        timeout-minutes: 20
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/pr-review.md
        run: python3 "$PR_REVIEW"

      - name: Progress — completed
        if: success()
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 "$AGENTLIB" progress pr completed

      - name: Report failure on pull request
        if: failure()
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/pr-review-progress-comment-id" ]]; then
            python3 "$AGENTLIB" progress pr failed || true
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "⚠️ @agent レビューを完了できませんでした。進捗コメントと [ワークフロー実行]($RUN_URL) を確認してください。"
