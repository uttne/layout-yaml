# Issue 実装・方針すり合わせ via Cursor CLI.
#
# Trigger: comment on an Issue (not a PR) from the repository owner, containing @agent.
#
# Subcommands:
#   @agent / @agent plan  — 方針の会話（リポジトリ変更なし）
#   @agent go             — 実装・push・PR 作成
#   @agent sync           — cursor-issue-sync.yml（本 workflow では起動しない）
#
# Additional lines in the same comment are passed to the agent in full.
#
# Prompts: .github/workflows/prompts/issue-agent-{plan,go}.md
#          + .cursor/issue-agent.md (optional)
#
# Model: Composer 2.5 chooses Composer 2.5 or Grok 4.7 medium from the
# issue contents. Avoid "auto" — it may route to other premium models.
#
# Requires repository secret: CURSOR_API_KEY
# See https://cursor.com/docs/cli/github-actions

name: Cursor Issue agent (@agent)

on:
  issue_comment:
    types: [created]

# workflows: write は意図的に付けない。.github/workflows の push はしない。
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@agent') &&
      !contains(github.event.comment.body, '@agent sync') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cursor-issue-agent-${{ github.event.issue.number }}
      cancel-in-progress: true

    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      TRIGGERED_BY: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Load workflow scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/workflows/prompts
          sparse-checkout-cone-mode: true

      - name: Load trigger comment
        run: bash .github/scripts/load-trigger-comment.sh

      - name: Parse @agent subcommand
        id: parse
        run: bash .github/scripts/parse-issue-agent-comment.sh

      - name: Stop when subcommand invalid
        if: steps.parse.outputs.invalid == 'true'
        run: echo "Unsupported @agent subcommand; usage comment posted."

      - name: Acknowledge request
        if: steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content='eyes' >/dev/null
          python3 .github/scripts/issue_agent.py progress received

      - name: Progress — issue context loaded
        if: steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
        run: python3 .github/scripts/issue_agent.py progress issue_loaded

      - name: Resolve default branch
        if: steps.parse.outputs.invalid != 'true'
        id: repo
        run: |
          set -euo pipefail
          default_branch=$(gh repo view "$REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.parse.outputs.invalid != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.repo.outputs.default_branch }}
          fetch-depth: 0

      - name: Progress — repository checked out
        if: steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
        run: python3 .github/scripts/issue_agent.py progress checked_out

      - name: Preserve model router
        if: steps.parse.outputs.invalid != 'true'
        run: |
          set -euo pipefail
          cp .github/scripts/agentlib.py "$RUNNER_TEMP/agentlib.py"
          echo "AGENTLIB=$RUNNER_TEMP/agentlib.py" >> "$GITHUB_ENV"

      - name: Prepare work branch (go)
        if: steps.parse.outputs.invalid != 'true' && steps.parse.outputs.mode == 'go'
        id: branch
        env:
          AGENT_MODE: go
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
        run: |
          set -euo pipefail
          # Resume checks out an older branch that may not contain the current
          # publish script or go prompt. Keep the default-branch copies.
          mkdir -p "$RUNNER_TEMP/go-tools/scripts" "$RUNNER_TEMP/go-tools/prompts"
          cp .github/scripts/agentlib.py "$RUNNER_TEMP/go-tools/scripts/"
          cp .github/scripts/issue_agent.py "$RUNNER_TEMP/go-tools/scripts/"
          cp .github/scripts/publish-go.sh "$RUNNER_TEMP/go-tools/scripts/"
          cp .github/workflows/prompts/issue-agent-go.md "$RUNNER_TEMP/go-tools/prompts/"
          if [[ -f .cursor/issue-agent.md ]]; then
            cp .cursor/issue-agent.md "$RUNNER_TEMP/go-tools/issue-agent.md"
          fi
          bash .github/scripts/prepare-go-branch.sh
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/go-branch.env"
          echo "ISSUE_AGENT_PY=$RUNNER_TEMP/go-tools/scripts/issue_agent.py" >> "$GITHUB_ENV"
          BRANCH_NAME="$WORK_BRANCH" python3 "$RUNNER_TEMP/go-tools/scripts/issue_agent.py" progress branch_ready

      - name: Install Cursor CLI
        if: steps.parse.outputs.invalid != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Progress — CLI ready
        if: steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
          BRANCH_NAME: ${{ steps.branch.outputs.work_branch }}
        run: python3 "${ISSUE_AGENT_PY:-.github/scripts/issue_agent.py}" progress cli_ready

      - name: Select agent model
        if: steps.parse.outputs.invalid != 'true'
        timeout-minutes: 8
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ROUTER_TASK: ${{ steps.parse.outputs.mode }}
        run: python3 "$AGENTLIB" select-model

      - name: Progress — model selected
        if: steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
          BRANCH_NAME: ${{ steps.branch.outputs.work_branch }}
        run: python3 "${ISSUE_AGENT_PY:-.github/scripts/issue_agent.py}" progress cli_ready

      - name: Run @agent plan
        if: steps.parse.outputs.invalid != 'true' && steps.parse.outputs.mode == 'plan'
        timeout-minutes: 25
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_MODE: plan
          ISSUE_REPLY_OUTPUT_PATH: ${{ runner.temp }}/issue-agent-reply.md
        run: python3 .github/scripts/issue_agent.py run

      - name: Run @agent go
        id: go_agent
        if: steps.parse.outputs.invalid != 'true' && steps.parse.outputs.mode == 'go'
        continue-on-error: true
        timeout-minutes: 75
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_MODE: go
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
          GO_RESUMED: ${{ steps.branch.outputs.resumed }}
          GO_STATUS_PATH: ${{ runner.temp }}/go-status.md
          GO_NOTE_PATH: ${{ runner.temp }}/go-note.md
          GO_PR_BODY_PATH: ${{ runner.temp }}/go-pr-body.md
          AGENT_NOTE_PATH: ${{ runner.temp }}/go-note.md
          PROMPT_TEMPLATE_PATH: ${{ runner.temp }}/go-tools/prompts/issue-agent-go.md
          PROJECT_CONTEXT_PATH: ${{ runner.temp }}/go-tools/issue-agent.md
        run: python3 "$ISSUE_AGENT_PY" run

      - name: Publish branch, pull request, and implementation record
        if: steps.parse.outputs.invalid != 'true' && steps.parse.outputs.mode == 'go'
        env:
          AGENT_MODE: go
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
          BRANCH_NAME: ${{ steps.branch.outputs.work_branch }}
          GO_STATUS_PATH: ${{ runner.temp }}/go-status.md
          GO_PR_BODY_PATH: ${{ runner.temp }}/go-pr-body.md
          AGENT_NOTE_PATH: ${{ runner.temp }}/go-note.md
        run: |
          set -euo pipefail
          python3 "${ISSUE_AGENT_PY:-.github/scripts/issue_agent.py}" progress publishing
          bash "$RUNNER_TEMP/go-tools/scripts/publish-go.sh"

      - name: Fail when go agent did not finish
        if: steps.go_agent.outcome == 'failure'
        run: exit 1

      - name: Report failure on issue
        if: failure() && steps.parse.outputs.invalid != 'true'
        env:
          AGENT_MODE: ${{ steps.parse.outputs.mode }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
          BRANCH_NAME: ${{ steps.branch.outputs.work_branch }}
          AGENT_NOTE_PATH: ${{ runner.temp }}/go-note.md
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/issue-agent-progress-comment-id.final" ]]; then
            echo "Result comment already written."
            exit 0
          fi
          python3 "${ISSUE_AGENT_PY:-.github/scripts/issue_agent.py}" progress failed || true
